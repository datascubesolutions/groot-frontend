name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ESLint now includes jsx-a11y rules — label associations, alt text,
      # ARIA props, interactive focus, href="#" prevention, and no-img-element.
      - name: Run ESLint (includes accessibility rules)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check || true

      - name: Type check
        run: npm run type-check || true

      - name: Run tests
        run: npm run test -- --coverage --watchAll=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: groot-frontend
          fail_ci_if_error: false

  # ── Accessibility Audit ─────────────────────────────────────────────────────
  # Runs pa11y against key pages after build. Threshold of 5 so a single
  # contrast warning doesn't block the PR; reduce as the codebase improves.
  accessibility-audit:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_ENV: test

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Start server and run pa11y accessibility audit
        run: |
          npm run start &
          sleep 10
          pa11y-ci \
            --threshold 5 \
            http://localhost:3000 \
            http://localhost:3000/industries \
            http://localhost:3000/contact \
            http://localhost:3000/blog || echo "::warning::pa11y found accessibility issues — review the output above"
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

  # ── Lighthouse CI ───────────────────────────────────────────────────────────
  # Enforces: accessibility ≥ 0.90, LCP < 2500ms, CLS < 0.1 per lighthouserc.json
  lighthouse-ci:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_ENV: test

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

  # ── Security Scan ───────────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
